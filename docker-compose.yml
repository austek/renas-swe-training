services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incident
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: incident
      DB_USER: incident
      DB_PASSWORD: incident
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
